name: Update contribution heatmap

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_heatmap.py
      - .github/workflows/update_heatmap.yml

permissions:
  contents: write

concurrency:
  group: contribution-heatmap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate heatmaps
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN || github.token }}
        run: python3 scripts/generate_heatmap.py
      - name: Commit changes if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg assets/contributions-light.svg
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'chore: refresh contribution heatmap'
            git push
          fi
