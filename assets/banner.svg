<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shruhath Reddy - Software Engineer and Systems Builder</title>
  <desc id="desc">A dark technical banner with orange highlights, a terminal window, and connected network nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B10"/>
      <stop offset="0.54" stop-color="#11131A"/>
      <stop offset="1" stop-color="#090B10"/>
    </linearGradient>
    <linearGradient id="accent" x1="88" y1="84" x2="720" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB86B"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(990 170) rotate(139) scale(344 344)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <g opacity="0.64">
    <path d="M848 79L957 129L1083 81M957 129L1044 217M957 129L867 241M1044 217L1122 283M1044 217L867 241M867 241L785 300" stroke="#F97316" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M848 79L867 241M1083 81L1044 217M957 129L1122 283" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <g fill="#F97316" filter="url(#softGlow)">
      <circle cx="848" cy="79" r="4"/>
      <circle cx="957" cy="129" r="6"/>
      <circle cx="1083" cy="81" r="3.5"/>
      <circle cx="1044" cy="217" r="5"/>
      <circle cx="1122" cy="283" r="3.5"/>
      <circle cx="867" cy="241" r="5"/>
      <circle cx="785" cy="300" r="3.5"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="848" cy="79" r="1.5"/>
      <circle cx="957" cy="129" r="2"/>
      <circle cx="1083" cy="81" r="1.5"/>
      <circle cx="1044" cy="217" r="1.5"/>
      <circle cx="1122" cy="283" r="1.5"/>
      <circle cx="867" cy="241" r="1.5"/>
      <circle cx="785" cy="300" r="1.5"/>
    </g>
  </g>

  <g transform="translate(70 60)">
    <rect width="650" height="240" rx="18" fill="#0D0F14" fill-opacity="0.82" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <path d="M0 50H650" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <circle cx="26" cy="25" r="5" fill="#F97316"/>
    <circle cx="46" cy="25" r="5" fill="#F97316" fill-opacity="0.45"/>
    <circle cx="66" cy="25" r="5" fill="#F97316" fill-opacity="0.20"/>
    <text x="610" y="30" fill="#7D8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">~/shruhath</text>

    <text x="32" y="91" fill="#F97316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">$ whoami</text>
    <text x="32" y="142" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="45" font-weight="800" letter-spacing="1.4">SHRUHATH REDDY</text>
    <text x="34" y="178" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.2">SOFTWARE ENGINEER  /  SYSTEMS BUILDER</text>
    <text x="34" y="215" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">Go  •  Distributed Systems  •  AI  •  Full-Stack</text>
    <rect x="515" y="202" width="9" height="17" rx="1.5" fill="#F97316">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.25s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(805 272)">
    <rect width="310" height="40" rx="20" fill="#F97316" fill-opacity="0.10" stroke="#F97316" stroke-opacity="0.34"/>
    <circle cx="22" cy="20" r="5" fill="#39D353"/>
    <text x="39" y="25" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">shipping systems people use</text>
  </g>
</svg>
